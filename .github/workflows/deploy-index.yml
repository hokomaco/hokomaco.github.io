name: Deploy index.html from release asset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download temp-deploy-horizontal --repo hokomaco/hokomaco.github.io --pattern 'hokomaco-pin-dao-guan-wang.html' --dir /tmp/deploy
          ls -lh /tmp/deploy
          mv /tmp/deploy/hokomaco-pin-dao-guan-wang.html index.html
          ls -lh index.html
      - name: Commit index.html
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy latest index.html with horizontal card images" || echo "No changes"
          git push
