name: Deploy index from release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/site
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern "*.html" --dir /tmp/site
          ls -lh /tmp/site
          cp /tmp/site/*.html index.html
          ls -lh index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy 30-person index.html" || echo "No changes to commit"
          git push
