name: Deploy index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and replace index.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download temp-deploy-20261106 --pattern 'hokomaco-pin-dao-guan-wang.html' --dir /tmp/dl
          ls -lh /tmp/dl
          cp /tmp/dl/hokomaco-pin-dao-guan-wang.html index.html
          ls -lh index.html
          sha256sum index.html
      - name: Commit index.html
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          git add index.html
          git diff --cached --stat
          git commit -m "Deploy latest index.html with fixed font-size toggle" || echo "no changes to commit"
          git push
