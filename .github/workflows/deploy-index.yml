name: Deploy index from release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and replace index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          gh release download "$TAG" --pattern "*.html" --dir /tmp/release-asset --clobber
          FILE=$(ls /tmp/release-asset/*.html | head -n 1)
          echo "Downloaded: $FILE"
          ls -lh "$FILE"
          cp "$FILE" index.html
          ls -lh index.html
      - name: Commit and push index.html
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Deploy language-trimmed index.html"
          git push
