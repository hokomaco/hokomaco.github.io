name: Deploy index.html from release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        run: |
          curl -L -o /tmp/hokomaco-pin-dao-guan-wang.html "https://github.com/hokomaco/hokomaco.github.io/releases/download/deploy-20261105-v2/hokomaco-pin-dao-guan-wang.html"
          ls -l /tmp/hokomaco-pin-dao-guan-wang.html
          sha256sum /tmp/hokomaco-pin-dao-guan-wang.html
      - name: Replace index.html and commit
        run: |
          cp /tmp/hokomaco-pin-dao-guan-wang.html index.html
          ls -l index.html
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Deploy card-fixed index.html"
          git push
