name: Replace index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with latest file
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@gmail.com"
          mv -f hokomaco-pin-dao-guan-wang.html index.html
          git add -A
          git commit -m "Update index.html"
          git push
