name: Temp Deploy Index

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag holding the HTML asset'
        required: true
        default: 'temp-deploy-20261106'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and replace index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/asset
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "*.html" --dir /tmp/asset
          ls -lh /tmp/asset
          cp /tmp/asset/*.html index.html
          ls -lh index.html
          wc -c index.html
      - name: Commit index.html
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy latest index.html with Home nav, fixed fonts and Quiz/Timeline spacing fix" || echo "No changes to commit"
          git push
