name: Temporary deploy index.html from Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag containing index.html'
        required: true
        default: 'temp-deploy-20261106-curie-joan'
      asset:
        description: 'Release asset file name'
        required: true
        default: 'hokomaco-pin-dao-guan-wang.html'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download index.html from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "${{ inputs.asset }}" --dir /tmp/deploy
          cp "/tmp/deploy/${{ inputs.asset }}" index.html
          ls -lh index.html
      - name: Commit and push index.html
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy latest index.html with Curie and Joan portrait fixes" || echo "No changes to commit"
          git push
