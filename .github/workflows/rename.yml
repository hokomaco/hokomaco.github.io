name: Rename file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@gmail.com"
          git mv hokomaco-pin-dao-guan-wang.html index.html
          git commit -m "Rename hokomaco-pin-dao-guan-wang.html to index.html"
          git push
