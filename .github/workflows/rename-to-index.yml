name: Rename uploaded HTML to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "hokomaco"
          git config user.email "hokomaco@users.noreply.github.com"
          ls -l
          git mv hokomaco-pin-dao-guan-wang.html index.html
          git commit -m "将最新版网站 HTML 重命名为 index.html"
          git push
